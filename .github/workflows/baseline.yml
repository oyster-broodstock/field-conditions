name: Rebuild temperature baselines

# Run by hand (Actions tab > Rebuild temperature baselines > Run workflow), about once a year
# or after changing a site's "baseline" station in web/sites.json. Commits web/baseline/*.json.

on:
  workflow_dispatch:
    inputs:
      start:
        description: First year
        default: "2016"

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python baseline/history.py --start "${{ inputs.start }}"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/baseline
          git diff --cached --quiet || (git commit -qm "Rebuild temperature baselines" && git push)
