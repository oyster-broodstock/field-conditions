name: Fetch data and deploy site

on:
  schedule:
    - cron: "7 * * * *"   # hourly; GitHub may delay scheduled runs by several minutes
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "PLAN.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests (offline)
        run: python -m unittest discover ingest/tests

      - id: pages
        uses: actions/configure-pages@v5

      - name: Fetch public data
        # Standard library only. Falls back to the published file for any source that fails.
        run: python ingest/fetch.py --out web/data --fallback-url "${{ steps.pages.outputs.base_url }}/data"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
