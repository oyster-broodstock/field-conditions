name: Archive observations (daily)

# Runs once a day instead of hourly to keep the data branch history compact.
# Because each fetch retrieves a 7-day rolling window, a daily run captures every observation
# without missing readings, and failures surface directly instead of being hidden.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch recent observations
        run: python ingest/fetch.py --out web/data

      - name: Append to archive (data branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin data; then
            git worktree add -B data ../archive FETCH_HEAD
          else
            git worktree add --detach ../archive
            git -C ../archive checkout --orphan data
            git -C ../archive rm -rfq .
          fi
          python ingest/archive.py web/data ../archive/archive
          git -C ../archive add -A
          if git -C ../archive diff --cached --quiet; then
            echo "No new observations."
          else
            git -C ../archive commit -qm "Observations to $(date -u +%Y-%m-%dT%H:%MZ)"
            git -C ../archive push origin data
          fi
